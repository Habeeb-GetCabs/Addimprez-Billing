name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradle Executable
        run: |
          chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p ./build-output
          cp ./android/app/build/outputs/apk/debug/app-debug.apk ./build-output/BillingApp-release.apk
          echo "APK generated successfully:"
          ls -lh ./build-output/BillingApp-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Billing-App-APK
          path: ./build-output/BillingApp-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release with APK (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./build-output/BillingApp-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 📱 Android APK Ready for Download
            Download `BillingApp-release.apk` directly to your Android device to install and use offline.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "### 🚀 Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Android APK has been built successfully and is ready for download:" >> $GITHUB_STEP_SUMMARY
          echo "- **File Name:** \`BillingApp-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Ready for Android install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📲 How to Download from GitHub:" >> $GITHUB_STEP_SUMMARY
          echo "1. On this Actions run page, scroll down to the **Artifacts** section at the bottom." >> $GITHUB_STEP_SUMMARY
          echo "2. Click **Android-Billing-App-APK** to download the zip file containing your APK." >> $GITHUB_STEP_SUMMARY
          echo "3. Open the downloaded zip and install \`BillingApp-release.apk\` on your Android device." >> $GITHUB_STEP_SUMMARY
