name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p ./build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk ./build-output/Addimprez-Billing.apk
          echo "APK successfully generated:"
          ls -lh ./build-output/Addimprez-Billing.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Addimprez-Billing-Android-APK
          path: ./build-output/Addimprez-Billing.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release with APK (When tagging)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./build-output/Addimprez-Billing.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 📱 Android APK Ready
            Download `Addimprez-Billing.apk` directly to your Android device to install.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
