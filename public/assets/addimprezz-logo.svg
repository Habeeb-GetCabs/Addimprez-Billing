<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" fill="none">
  <defs>
    <filter id="stemShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#18181b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left: Typography Group -->
  <g transform="translate(15, 0)">
    <!-- Main Brand Name: addimprez -->
    <!-- 'add' -->
    <text x="0" y="150" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', system-ui, -apple-system, sans-serif" font-size="120" font-weight="800" fill="#1e293b" letter-spacing="-1.5">add</text>
    
    <!-- 'i' stem without dot -->
    <text x="215" y="150" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', system-ui, -apple-system, sans-serif" font-size="120" font-weight="800" fill="#1e293b">ı</text>
    <!-- 'i' cyan dot (exact matching circle) -->
    <circle cx="232" cy="72" r="14.5" fill="#22b0ea" />

    <!-- 'mprez' (single 'z') -->
    <text x="260" y="150" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', system-ui, -apple-system, sans-serif" font-size="120" font-weight="800" fill="#1e293b" letter-spacing="-1.5">mprez</text>

    <!-- Tagline: create the dreams... -->
    <text x="5" y="210" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', system-ui, -apple-system, sans-serif" font-size="33" font-weight="800" fill="#22b0ea" letter-spacing="1.2">create the dreams...</text>
  </g>

  <!-- Right: Official Mosaic Pebble Emblem -->
  <g transform="translate(645, 5)">
    <!-- Clip path for the pebble container -->
    <clipPath id="pebbleClip">
      <path d="M 48 36 C 90 15, 140 10, 195 24 C 230 33, 245 52, 238 88 C 230 130, 218 175, 192 215 C 182 232, 166 238, 150 228 C 120 208, 65 140, 42 100 C 28 75, 25 48, 48 36 Z" />
    </clipPath>

    <!-- Base / Border Container -->
    <path d="M 48 36 C 90 15, 140 10, 195 24 C 230 33, 245 52, 238 88 C 230 130, 218 175, 192 215 C 182 232, 166 238, 150 228 C 120 208, 65 140, 42 100 C 28 75, 25 48, 48 36 Z" 
          fill="#27272a" stroke="#27272a" stroke-width="4" stroke-linejoin="round" />

    <!-- Clipped Mosaic Cell Segments -->
    <g clip-path="url(#pebbleClip)">
      <!-- Background base dark charcoal -->
      <rect x="0" y="0" width="280" height="260" fill="#3f3f46" />

      <!-- Top-left light segment -->
      <path d="M 20 20 C 60 10, 120 20, 145 60 C 130 90, 80 110, 40 105 Z" fill="#d4d4d8" />

      <!-- Bottom-left darker segment -->
      <path d="M 30 100 C 80 105, 125 90, 145 135 C 115 180, 80 180, 50 150 Z" fill="#27272a" />

      <!-- Center-right mid-tone slate segment -->
      <path d="M 140 30 C 170 25, 220 40, 235 70 C 220 130, 190 180, 150 225 C 135 180, 130 100, 140 30 Z" fill="#52525b" />

      <!-- Heavy Organic Divider Strokes -->
      <path d="M 145 25 C 135 75, 130 110, 145 155 C 155 190, 160 215, 165 230" stroke="#27272a" stroke-width="11" fill="none" stroke-linecap="round" />
      <path d="M 35 105 C 80 108, 115 95, 140 85" stroke="#27272a" stroke-width="11" fill="none" stroke-linecap="round" />
      <path d="M 45 15 C 85 45, 120 50, 140 50" stroke="#27272a" stroke-width="9" fill="none" stroke-linecap="round" />
      <path d="M 140 150 C 190 145, 225 150, 240 160" stroke="#27272a" stroke-width="10" fill="none" stroke-linecap="round" />

      <!-- Lowercase 'i' stem (White Pillar) inside emblem with soft shadow -->
      <path d="M 160 105 L 205 105 L 205 175 C 205 188, 196 195, 185 195 L 160 195 Z" 
            fill="#ffffff" filter="url(#stemShadow)" />

      <!-- Lowercase 'i' dot (Vibrant Cyan Circle) inside emblem -->
      <circle cx="182" cy="72" r="26" fill="#22b0ea" />
    </g>

    <!-- Exterior Smooth Border Line -->
    <path d="M 48 36 C 90 15, 140 10, 195 24 C 230 33, 245 52, 238 88 C 230 130, 218 175, 192 215 C 182 232, 166 238, 150 228 C 120 208, 65 140, 42 100 C 28 75, 25 48, 48 36 Z" 
          fill="none" stroke="#27272a" stroke-width="6" stroke-linejoin="round" />
  </g>
</svg>